name: Windows

on:
  push:
    paths:
      - "Windows/**"
      - "Sources/Cadenza/BridgeScript.swift"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: >
          dotnet publish Windows/Cadenza.Windows.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      # Launches the app against the real YouTube Music (signed out), loads Home, plays two
      # songs in a row, opens lyrics and search, and saves a log and screenshots.
      - name: Smoke test
        shell: pwsh
        run: |
          $env:CADENZA_SELFTEST = "$PWD\selftest.log"
          $p = Start-Process -FilePath out\Cadenza.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "Timed out" }
          if (Test-Path selftest.log) { Get-Content selftest.log } else { Write-Host "No log written" }
          if (Test-Path "$env:LOCALAPPDATA\Cadenza\errors.log") { Get-Content "$env:LOCALAPPDATA\Cadenza\errors.log" }
          if (Select-String -Path selftest.log -Pattern "^\S+ FAIL" -Quiet) { exit 1 }

      # MSIX package for the Microsoft Store. Identity values are placeholders until the app name
      # is reserved in Partner Center; set them as repository variables then.
      - name: Package MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Cadenza.Preview' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Cadenza Preview' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Cadenza' }}
        run: |
          $version = ([xml](Get-Content Windows/Cadenza.Windows.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          $layout = "msix"
          New-Item -ItemType Directory $layout, "$layout/Assets" | Out-Null
          Copy-Item out/* $layout -Recurse
          Copy-Item Windows/Assets/*.png "$layout/Assets"
          (Get-Content Windows/Package/AppxManifest.xml -Raw).
            Replace('$IDENTITY_NAME$', $env:IDENTITY_NAME).Replace('$PUBLISHER$', $env:PUBLISHER).
            Replace('$PUBLISHER_DISPLAY_NAME$', $env:PUBLISHER_DISPLAY_NAME).Replace('$VERSION$', "$version.0") |
            Set-Content "$layout/AppxManifest.xml" -Encoding utf8
          # Newest Windows SDK that actually has the packaging tools.
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.DirectoryName -like '*\x64' } |
            Sort-Object { [version]($_.Directory.Parent.Name -replace '[^0-9.]', '') } -Descending | Select-Object -First 1
          $sdk = $tool.Directory
          Write-Host "Using $($sdk.FullName)"
          & "$($sdk.FullName)\makeappx.exe" pack /d $layout /p "Cadenza-$version-x64.msix" /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # Prove it installs: sign with a throwaway certificate, trust it, install, check, remove.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Copy-Item "Cadenza-$version-x64.msix" test.msix
          & "$($sdk.FullName)\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint test.msix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "TrustedPeople", "LocalMachine"
          $store.Open("ReadWrite"); $store.Add($cert); $store.Close()
          Add-AppxPackage test.msix
          $pkg = Get-AppxPackage -Name $env:IDENTITY_NAME
          if (-not $pkg) { Write-Error "MSIX did not install"; exit 1 }
          Write-Host "Installed $($pkg.PackageFullName)"
          Remove-AppxPackage $pkg.PackageFullName

      - uses: actions/upload-artifact@v4
        with:
          name: Cadenza-msix
          path: Cadenza-*.msix

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest*.log
            selftest*.png

      - uses: actions/upload-artifact@v4
        with:
          name: Cadenza-windows-x64
          path: out/
